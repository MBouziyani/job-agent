<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Job Agent{% endblock %}</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --yellow:   #d29922;
      --orange:   #f0883e;
      --red:      #f85149;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 48px;
      gap: 0;
    }
    .nav-brand {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      margin-right: 32px;
      letter-spacing: -0.2px;
    }
    .nav-brand span { color: var(--accent); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      padding: 14px 12px;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--text); border-bottom-color: var(--accent); }

    /* ── page wrapper ── */
    .page { padding: 24px; }

    /* ── error banner ── */
    .banner {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .banner-error   { background: rgba(248,81,73,.12); border: 1px solid var(--red);    color: var(--red); }
    .banner-success { background: rgba(63,185,80,.12); border: 1px solid var(--green);  color: var(--green); }

    /* ── badges ── */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .bd  { background: rgba(88,166,255,.15); color: var(--accent); }
    .bg  { background: rgba(63,185,80,.15);  color: var(--green); }
    .by  { background: rgba(210,153,34,.15); color: var(--yellow); }
    .bo  { background: rgba(240,136,62,.15); color: var(--orange); }
    .bm  { background: rgba(125,133,144,.12); color: var(--muted); }
    .br  { background: rgba(248,81,73,.15);  color: var(--red); }

    /* ── kanban ── */
    .kanban {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: start;
    }
    .kanban-5 {
      grid-template-columns: repeat(5, 1fr);
    }
    .kanban-8 {
      grid-template-columns: repeat(8, 1fr);
    }
    .col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .col-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    .col-head.c-all       { color: var(--muted); }
    .col-head.c-discovered { color: var(--accent); }
    .col-head.c-qualified  { color: var(--green); }
    .col-head.c-email      { color: var(--yellow); }
    .col-head.c-contacted  { color: var(--orange); }

    .col-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .cards {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 74vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 11px;
    }
    .card:hover { border-color: var(--muted); }
    .card-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .card-meta { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-empty {
      padding: 20px 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* ── settings ── */
    .settings-wrap { max-width: 760px; }
    .settings-wrap h1 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 14px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { opacity: .88; }
    .btn-sm {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(63,185,80,.18);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(63,185,80,.35);
      border-radius: 5px;
      cursor: pointer;
      margin: 0;
    }
    .btn-sm:hover { background: rgba(63,185,80,.28); }

    /* ── pipeline stage buttons ── */
    .stage-btns { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .btn-advance {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }
    .btn-advance:hover { opacity: .8; }
    .btn-adv-replied   { color: var(--green);   border-color: rgba(63,185,80,.4); }
    .btn-adv-screen    { color: var(--yellow);  border-color: rgba(210,153,34,.4); }
    .btn-adv-interview { color: var(--orange);  border-color: rgba(240,136,62,.4); }
    .btn-adv-offer     { color: var(--green);   border-color: rgba(63,185,80,.4); }
    .btn-adv-reject    { color: var(--red);     border-color: rgba(248,81,73,.4); }

    /* ── stats ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green  { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.orange { color: var(--orange); }
    .stat-value.red    { color: var(--red); }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .domain-link { color: var(--accent); text-decoration: none; }
    .domain-link:hover { text-decoration: underline; }

    /* ── review ── */
    .review-list { display: flex; flex-direction: column; gap: 16px; max-width: 860px; }
    .review-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .review-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .review-company { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .review-company-name { font-size: 15px; font-weight: 600; }
    .review-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .review-meta {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .review-subject {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .email-body {
      padding: 14px 16px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .review-actions {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
    }
    .btn-action {
      padding: 7px 20px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-approve {
      background: var(--green);
      color: #000;
    }
    .btn-approve:hover { opacity: .88; }
    .btn-skip {
      background: rgba(248,81,73,.15);
      color: var(--red);
      border: 1px solid rgba(248,81,73,.3);
    }
    .btn-skip:hover { background: rgba(248,81,73,.25); }

    /* ── companies filter tabs ── */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .filter-tab {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid var(--border);
      transition: color .15s, border-color .15s, background .15s;
    }
    .filter-tab:hover { color: var(--text); border-color: var(--muted); }
    .filter-tab.active { color: var(--text); border-color: var(--accent); background: rgba(88,166,255,.1); }
    /* ── region toggle ── */
    .region-switch {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin: 0 0 16px;
      width: fit-content;
    }
    .region-btn {
      padding: 6px 18px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      transition: color .15s, background .15s;
    }
    .region-btn:hover { color: var(--text); }
    .region-btn.active {
      color: #000;
      background: var(--accent);
    }
    .region-btn.morocco.active {
      color: #000;
      background: var(--green);
    }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">Job<span>Agent</span></span>
    <a href="/pipeline"  {% if request.path == '/pipeline' or request.path == '/' %}class="active"{% endif %}>Pipeline</a>
    <a href="/outreach"  {% if request.path == '/outreach' %}class="active"{% endif %}>Outreach</a>
    <a href="/cv-adapter"  {% if request.path == '/cv-adapter' %}class="active"{% endif %}>CV Adapter</a>
    <a href="/review"    {% if request.path == '/review' %}class="active"{% endif %}>Review</a>
    <a href="/companies" {% if request.path == '/companies' %}class="active"{% endif %}>Companies</a>
    <a href="/stats"     {% if request.path == '/stats' %}class="active"{% endif %}>Stats</a>
    <a href="/settings"  {% if request.path == '/settings' %}class="active"{% endif %}>Settings</a>
    <div class="region-switch" style="margin-left:auto;margin-bottom:0;">
      {% set reg = region if region is defined else 'worldwide' %}
      <a class="region-btn {% if reg == 'worldwide' %}active{% endif %}"
         href="{{ request.path }}?region=worldwide">🌍 Worldwide</a>
      <a class="region-btn morocco {% if reg == 'morocco' %}active{% endif %}"
         href="{{ request.path }}?region=morocco">🇲🇦 Morocco</a>
    </div>
  </nav>

  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
