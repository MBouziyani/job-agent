services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped
