scraping:
  sources:
    remoteok: true
    we_work_remotely: true
    remotive: true
    jobspresso: true
    wellfound: true  # Scrapling StealthyFetcher bypasses Cloudflare
    stackoverflow: false  # Cloudflare blocks scraping
    hackernews: true
    workatastartup: true  # Y Combinator job board - server-side rendered, no Cloudflare

